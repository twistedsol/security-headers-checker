name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run the checker on the sample headers
        # Exit code 1 is expected here: one sample has a high finding.
        run: |
          python headers_checker.py --file sample_headers/01_bare_server.txt || test $? -eq 1
